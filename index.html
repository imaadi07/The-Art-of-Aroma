          <p>
            Rooted in centuries of Japanese Koh-do tradition, where every stick is an invitation to profound stillness.
            Formed on the windswept shores of Awaji Island, our incense sticks are extruded exclusively from wild-harvested woods,
            sacred tree resins, and natural Tabu-no-ki bark. We reject synthetic binders, toxic accelerants, and petroleum dyes.
            When planted into its hand-turned brass vessel, each stick burns with an uninterrupted silky plume for forty-five minutes
            of mindful contemplation.
          </p>
