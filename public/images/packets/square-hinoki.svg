<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient: Sacred Kyoto Cypress Forest & Obsidian -->
    <radialGradient id="bgGradHinoki" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#243026" />
      <stop offset="50%" stop-color="#151E17" />
      <stop offset="100%" stop-color="#0B100C" />
    </radialGradient>

    <!-- Metallic Sage-Gold Foil Gradient -->
    <linearGradient id="sageGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF5EA" />
      <stop offset="30%" stop-color="#C2D1AF" />
      <stop offset="65%" stop-color="#8F9E78" />
      <stop offset="100%" stop-color="#D7E3C8" />
    </linearGradient>

    <!-- Glassmorphic Highlight Overlay -->
    <linearGradient id="glassInsetHinoki" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Ethereal Forest Mist Glow -->
    <radialGradient id="mistGlowHinoki" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#588157" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowHinoki" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Plate with Outer Subtle Bevel & Shadow -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="url(#bgGradHinoki)" stroke="#2F3E32" stroke-width="2" filter="url(#softShadowHinoki)" />

  <!-- Glass Highlight Overlay -->
  <rect x="26" y="26" width="748" height="748" rx="26" fill="url(#glassInsetHinoki)" />

  <!-- Ambient Mist Glow behind Emblem -->
  <circle cx="400" cy="400" r="280" fill="url(#mistGlowHinoki)" />

  <!-- Outer Double Hairline Gold Border -->
  <rect x="48" y="48" width="704" height="704" rx="18" fill="none" stroke="url(#sageGoldFoil)" stroke-width="1.2" opacity="0.8" />
  <rect x="58" y="58" width="684" height="684" rx="14" fill="none" stroke="url(#sageGoldFoil)" stroke-width="0.6" opacity="0.4" stroke-dasharray="6 3" />

  <!-- Sacred Geometry Concentric Rings & Compass Ticks -->
  <circle cx="400" cy="400" r="230" fill="none" stroke="url(#sageGoldFoil)" stroke-width="0.8" opacity="0.35" />
  <circle cx="400" cy="400" r="180" fill="none" stroke="url(#sageGoldFoil)" stroke-width="0.6" opacity="0.25" stroke-dasharray="3 4" />
  <circle cx="400" cy="400" r="130" fill="none" stroke="url(#sageGoldFoil)" stroke-width="0.8" opacity="0.4" />

  <!-- Directional Cypress Accents -->
  <line x1="400" y1="140" x2="400" y2="190" stroke="url(#sageGoldFoil)" stroke-width="1.2" opacity="0.7" />
  <line x1="400" y1="610" x2="400" y2="660" stroke="url(#sageGoldFoil)" stroke-width="1.2" opacity="0.7" />
  <line x1="140" y1="400" x2="190" y2="400" stroke="url(#sageGoldFoil)" stroke-width="1.2" opacity="0.7" />
  <line x1="610" y1="400" x2="660" y2="400" stroke="url(#sageGoldFoil)" stroke-width="1.2" opacity="0.7" />

  <!-- Top Provenance Typography -->
  <text x="400" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#A3B18A" text-anchor="middle" letter-spacing="6">
    KISO VALLEY // N° 02
  </text>
  <text x="400" y="132" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-style="italic" fill="#C2D1AF" text-anchor="middle" letter-spacing="3">
    Sacred Shrine Cypress
  </text>

  <!-- Central Monumental Japanese Calligraphy Kanji: 檜 (Hinoki) -->
  <g fill="url(#sageGoldFoil)">
    <text x="400" y="380" font-family="'Cormorant Garamond', serif, 'Yu Mincho', 'Hiragino Mincho ProN'" font-size="110" font-weight="600" text-anchor="middle" letter-spacing="12">檜</text>
    <text x="400" y="490" font-family="'Cormorant Garamond', serif, 'Yu Mincho', 'Hiragino Mincho ProN'" font-size="95" font-weight="400" text-anchor="middle" letter-spacing="10">霧</text>
  </g>

  <!-- Traditional Cinnabar Vermilion Hanko Seal Stamp (Right of Center) -->
  <rect x="540" y="360" width="56" height="56" rx="6" fill="#A8282B" opacity="0.9" />
  <rect x="544" y="364" width="48" height="48" rx="4" fill="none" stroke="#F5D7A1" stroke-width="1.2" />
  <text x="568" y="394" font-family="'Yu Mincho', serif" font-size="20" font-weight="700" fill="#F5D7A1" text-anchor="middle">清</text>
  <text x="568" y="413" font-family="'Yu Mincho', serif" font-size="14" font-weight="700" fill="#F5D7A1" text-anchor="middle">澄</text>

  <!-- Bottom Formulation Identification -->
  <text x="400" y="630" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="400" fill="#F2EEE5" text-anchor="middle" letter-spacing="4">
    Hinoki Mist
  </text>
  <text x="400" y="660" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#A3B18A" text-anchor="middle" letter-spacing="4">
    MISTED KYOTO CYPRESS &amp; TEMPLE MOSS
  </text>
  <text x="400" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9E9A90" text-anchor="middle" letter-spacing="3">
    SACRED WHITE HINOKI • MOUNTAIN GRANITE • WILD VETIVER
  </text>

  <!-- Corner Ornamental Accents -->
  <circle cx="72" cy="72" r="3" fill="#A3B18A" />
  <circle cx="728" cy="72" r="3" fill="#A3B18A" />
  <circle cx="72" cy="728" r="3" fill="#A3B18A" />
  <circle cx="728" cy="728" r="3" fill="#A3B18A" />
</svg>
