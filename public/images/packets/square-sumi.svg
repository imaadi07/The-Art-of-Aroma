<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient: Deep Mineral Charcoal & Pine Ash Obsidian -->
    <radialGradient id="bgGradSumi" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#28282A" />
      <stop offset="50%" stop-color="#161618" />
      <stop offset="100%" stop-color="#09090A" />
    </radialGradient>

    <!-- Metallic Platinum-Silver Foil Gradient -->
    <linearGradient id="silverFoilSumi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#DADADA" />
      <stop offset="65%" stop-color="#9E9E9E" />
      <stop offset="100%" stop-color="#E8E8E8" />
    </linearGradient>

    <!-- Glassmorphic Highlight Overlay -->
    <linearGradient id="glassInsetSumi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Mineral Smoke Aura -->
    <radialGradient id="smokeGlowSumi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4D4D4" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#737373" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowSumi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Plate with Outer Subtle Bevel & Shadow -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="url(#bgGradSumi)" stroke="#38383B" stroke-width="2" filter="url(#softShadowSumi)" />

  <!-- Glass Highlight Overlay -->
  <rect x="26" y="26" width="748" height="748" rx="26" fill="url(#glassInsetSumi)" />

  <!-- Ambient Smoke Glow behind Emblem -->
  <circle cx="400" cy="400" r="280" fill="url(#smokeGlowSumi)" />

  <!-- Outer Double Hairline Silver Border -->
  <rect x="48" y="48" width="704" height="704" rx="18" fill="none" stroke="url(#silverFoilSumi)" stroke-width="1.2" opacity="0.8" />
  <rect x="58" y="58" width="684" height="684" rx="14" fill="none" stroke="url(#silverFoilSumi)" stroke-width="0.6" opacity="0.4" stroke-dasharray="6 3" />

  <!-- Sacred Geometry Concentric Rings & Zen Enso Circle -->
  <circle cx="400" cy="400" r="230" fill="none" stroke="url(#silverFoilSumi)" stroke-width="0.8" opacity="0.35" />
  <circle cx="400" cy="400" r="180" fill="none" stroke="url(#silverFoilSumi)" stroke-width="2.2" opacity="0.5" stroke-dasharray="32 10" stroke-linecap="round" />
  <circle cx="400" cy="400" r="130" fill="none" stroke="url(#silverFoilSumi)" stroke-width="0.8" opacity="0.4" />

  <!-- Directional Caligraphy Ticks -->
  <line x1="400" y1="140" x2="400" y2="190" stroke="url(#silverFoilSumi)" stroke-width="1.2" opacity="0.7" />
  <line x1="400" y1="610" x2="400" y2="660" stroke="url(#silverFoilSumi)" stroke-width="1.2" opacity="0.7" />
  <line x1="140" y1="400" x2="190" y2="400" stroke="url(#silverFoilSumi)" stroke-width="1.2" opacity="0.7" />
  <line x1="610" y1="400" x2="660" y2="400" stroke="url(#silverFoilSumi)" stroke-width="1.2" opacity="0.7" />

  <!-- Top Provenance Typography -->
  <text x="400" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#B0B0B0" text-anchor="middle" letter-spacing="6">
    NARA ATELIER // N° 03
  </text>
  <text x="400" y="132" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-style="italic" fill="#E0E0E0" text-anchor="middle" letter-spacing="3">
    Pine Ash Ink &amp; Mountain Botanicals
  </text>

  <!-- Central Monumental Japanese Calligraphy Kanji: 墨 (Sumi) -->
  <g fill="url(#silverFoilSumi)">
    <text x="400" y="380" font-family="'Cormorant Garamond', serif, 'Yu Mincho', 'Hiragino Mincho ProN'" font-size="110" font-weight="600" text-anchor="middle" letter-spacing="12">墨</text>
    <text x="400" y="490" font-family="'Cormorant Garamond', serif, 'Yu Mincho', 'Hiragino Mincho ProN'" font-size="95" font-weight="400" text-anchor="middle" letter-spacing="10">紫</text>
  </g>

  <!-- Traditional Cinnabar Vermilion Hanko Seal Stamp (Right of Center) -->
  <rect x="540" y="360" width="56" height="56" rx="6" fill="#A8282B" opacity="0.9" />
  <rect x="544" y="364" width="48" height="48" rx="4" fill="none" stroke="#F5D7A1" stroke-width="1.2" />
  <text x="568" y="394" font-family="'Yu Mincho', serif" font-size="20" font-weight="700" fill="#F5D7A1" text-anchor="middle">静</text>
  <text x="568" y="413" font-family="'Yu Mincho', serif" font-size="14" font-weight="700" fill="#F5D7A1" text-anchor="middle">寂</text>

  <!-- Bottom Formulation Identification -->
  <text x="400" y="630" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="400" fill="#F2EEE5" text-anchor="middle" letter-spacing="4">
    Sumi &amp; Shiso
  </text>
  <text x="400" y="660" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#B0B0B0" text-anchor="middle" letter-spacing="4">
    STONE-GROUND PINE ASH &amp; RED SHISO
  </text>
  <text x="400" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9E9A90" text-anchor="middle" letter-spacing="3">
    BURNT CEDARWOOD • CRUSHED INDIGO • BLACK PEPPERCORN
  </text>

  <!-- Corner Ornamental Accents -->
  <circle cx="72" cy="72" r="3" fill="#B0B0B0" />
  <circle cx="728" cy="72" r="3" fill="#B0B0B0" />
  <circle cx="72" cy="728" r="3" fill="#B0B0B0" />
  <circle cx="728" cy="728" r="3" fill="#B0B0B0" />
</svg>
